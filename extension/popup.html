<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Audio Copyright Sentinel</title>
  <style>
    :root {
      --bg: #f8fafc; --card: #ffffff; --fg: #0f172a; --muted: #475569; --line: #e2e8f0;
      --primary: #1e3a8a; --primary-fg: #ffffff; --primary-soft: #eff6ff;
      --danger: #dc2626; --ok: #15803d; --ring: #1e3a8a;
      color-scheme: light dark;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #0b1120; --card: #111827; --fg: #f8fafc; --muted: #cbd5e1; --line: #1f2937;
        --primary: #93c5fd; --primary-fg: #0b1120; --primary-soft: #172554;
        --danger: #f87171; --ok: #4ade80; --ring: #93c5fd;
      }
    }
    * { box-sizing: border-box; }
    body { width: 360px; margin: 0; padding: 16px; background: var(--bg); color: var(--fg);
      font: 14px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
    h1 { font-size: 15px; margin: 0; font-weight: 700; }
    h2 { font-size: 12px; margin: 0 0 8px; font-weight: 600; letter-spacing: .04em; text-transform: uppercase; color: var(--muted); }
    header { display: flex; align-items: center; gap: 10px; margin-bottom: 14px; }
    header svg { color: var(--primary); flex: none; }
    header h1 { flex: 1; }
    section { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 14px; margin-bottom: 12px; }
    .stats { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 10px; }
    .stat b { display: block; font-size: 22px; line-height: 1.2; font-variant-numeric: tabular-nums; }
    .stat span, .meta { color: var(--muted); font-size: 12px; }
    .meta.error { color: var(--danger); }
    .row { display: flex; gap: 8px; align-items: center; }
    input[type=search], input[type=text] { width: 100%; min-height: 40px; padding: 8px 10px; border-radius: 8px;
      border: 1px solid var(--line); background: var(--bg); color: var(--fg); font: inherit; }
    label.field { display: block; font-size: 12px; font-weight: 600; margin-bottom: 4px; }
    button { min-height: 40px; padding: 0 14px; border-radius: 8px; border: 1px solid var(--line); background: var(--card);
      color: var(--fg); font: inherit; font-weight: 600; cursor: pointer; transition: background .15s, opacity .15s; }
    button:hover { background: var(--primary-soft); }
    button.primary { background: var(--primary); border-color: var(--primary); color: var(--primary-fg); }
    button.primary:hover { opacity: .9; }
    button:disabled { opacity: .6; cursor: progress; }
    :focus-visible { outline: 2px solid var(--ring); outline-offset: 2px; }
    ul { list-style: none; margin: 8px 0 0; padding: 0; max-height: 200px; overflow-y: auto; }
    li { display: flex; gap: 8px; align-items: center; padding: 8px 0; border-top: 1px solid var(--line); }
    li:first-child { border-top: 0; }
    li div { flex: 1; min-width: 0; }
    li strong { display: block; overflow-wrap: anywhere; }
    li small { color: var(--muted); }
    li button { min-height: 32px; padding: 0 10px; color: var(--danger); }
    .empty { color: var(--muted); font-size: 13px; padding: 8px 0 0; }
    .switch { position: relative; width: 44px; height: 26px; flex: none; }
    .switch input { position: absolute; inset: 0; opacity: 0; margin: 0; cursor: pointer; }
    .switch span { position: absolute; inset: 0; border-radius: 13px; background: var(--line); transition: background .15s; pointer-events: none; }
    .switch span::after { content: ""; position: absolute; top: 3px; left: 3px; width: 20px; height: 20px; border-radius: 50%;
      background: #fff; box-shadow: 0 1px 2px rgba(0,0,0,.3); transition: transform .15s; }
    .switch input:checked + span { background: var(--ok); }
    .switch input:checked + span::after { transform: translateX(18px); }
    .switch input:focus-visible + span { outline: 2px solid var(--ring); outline-offset: 2px; }
    form { display: grid; gap: 8px; margin-top: 10px; }
    footer { color: var(--muted); font-size: 12px; text-align: center; }
    @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
  </style>
</head>
<body>
  <header>
    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <path d="M20 13c0 5-3.5 7.5-7.66 8.95a1 1 0 0 1-.67-.01C7.5 20.5 4 18 4 13V6a1 1 0 0 1 1-1c2 0 4.5-1.2 6.24-2.72a1.17 1.17 0 0 1 1.52 0C14.51 3.81 17 5 19 5a1 1 0 0 1 1 1z"/><path d="m9 12 2 2 4-4"/>
    </svg>
    <h1>Audio Copyright Sentinel</h1>
    <label class="switch" title="Turn warnings on or off">
      <input type="checkbox" id="enabled" role="switch" aria-label="Warnings on">
      <span></span>
    </label>
  </header>

  <section aria-labelledby="cat-h">
    <h2 id="cat-h">Catalogue</h2>
    <div class="stats">
      <div class="stat"><b id="songs">–</b><span>songs</span></div>
      <div class="stat"><b id="artists">–</b><span>artist names</span></div>
    </div>
    <div class="row">
      <p class="meta" id="sync-meta" aria-live="polite" style="flex:1;margin:0"></p>
      <button id="sync" type="button">Check for updates</button>
    </div>
  </section>

  <section aria-labelledby="sites-h">
    <h2 id="sites-h">Sites</h2>
    <p class="meta" id="sites-meta" style="margin:0 0 10px"></p>
    <button id="all-sites" type="button" style="width:100%"></button>
  </section>

  <section aria-labelledby="search-h">
    <h2 id="search-h">Is this song listed?</h2>
    <input type="search" id="q" placeholder="Song title or artist" aria-label="Search songs or artists" autocomplete="off">
    <ul id="results" aria-live="polite"></ul>
  </section>

  <section aria-labelledby="mine-h">
    <h2 id="mine-h">My additions</h2>
    <ul id="custom"></ul>
    <form id="add">
      <div>
        <label class="field" for="title">Song title</label>
        <input type="text" id="title" required>
      </div>
      <div>
        <label class="field" for="artist">Artist (optional)</label>
        <input type="text" id="artist">
      </div>
      <button class="primary" type="submit">Add song</button>
    </form>
  </section>

  <footer>Public catalogue, not a legal register. Verify with ACPOSL.</footer>

  <script src="matcher.js"></script>
  <script src="popup.js"></script>
</body>
</html>
