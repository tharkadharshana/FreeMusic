name: CI & store release

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run lint
      - run: npm run build

  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Tag must match manifest version
        run: |
          VERSION=$(jq -r .version extension/manifest.json)
          [ "v$VERSION" = "$GITHUB_REF_NAME" ] || { echo "Tag $GITHUB_REF_NAME does not match manifest version $VERSION"; exit 1; }

      - name: Package
        run: cd extension && zip -r ../audio-copyright-sentinel.zip .

      - uses: actions/upload-artifact@v4
        with:
          name: audio-copyright-sentinel
          path: audio-copyright-sentinel.zip

      - name: Chrome Web Store
        uses: mnao305/chrome-extension-upload@v7.0.0
        with:
          file-path: audio-copyright-sentinel.zip
          extension-id: ${{ secrets.CHROME_EXTENSION_ID }}
          publisher-id: ${{ secrets.CHROME_PUBLISHER_ID }}
          client-id: ${{ secrets.CHROME_CLIENT_ID }}
          client-secret: ${{ secrets.CHROME_CLIENT_SECRET }}
          refresh-token: ${{ secrets.CHROME_REFRESH_TOKEN }}

      - name: Firefox Add-ons
        uses: wdzeng/firefox-addon@v1.2.1
        with:
          addon-guid: audio-sentinel@copyright-sentinel.local
          xpi-path: audio-copyright-sentinel.zip
          jwt-issuer: ${{ secrets.FIREFOX_JWT_ISSUER }}
          jwt-secret: ${{ secrets.FIREFOX_JWT_SECRET }}
